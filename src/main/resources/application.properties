server.port=8080
spring.application.name=chrome-history-dashboard

# --- App's own database (stores processed Browser_History/Tag/Analytics data) ---
spring.datasource.url=jdbc:mysql://localhost:3306/chrome_history_dashboard
spring.datasource.username=BanuYella
spring.datasource.password=Banu@5394
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Chrome's raw SQLite History file ---
# Leave blank to auto-detect the default profile path for the OS the backend runs on.
chrome.history.path=

app.api.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.api.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.api.cors.allowed-headers=*
app.api.cors.allow-credentials=true
app.api.cors.max-age=3600
